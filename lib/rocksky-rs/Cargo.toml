[package]
name = "rocksky-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "GPL-2.0-or-later"
description = "Rocksky scrobbling and remote player integration for Mixxx"
publish = false

[lib]
name = "rocksky_rs"
crate-type = ["rlib"]

[dependencies]
rocksky-sdk = { version = "0.11", default-features = false, features = ["appview", "remote-player"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[dev-dependencies]
tempfile = "3"
