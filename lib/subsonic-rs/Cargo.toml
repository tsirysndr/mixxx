[package]
name = "subsonic-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "GPL-2.0-or-later"
description = "Subsonic/Navidrome protocol client for Mixxx"
publish = false

[lib]
name = "subsonic_rs"
crate-type = ["rlib"]

[dependencies]
hex = "0.4"
md-5 = "0.10"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots", "json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
httpmock = "0.7"
