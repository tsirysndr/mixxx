[package]
name = "subsonic-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "GPL-2.0-or-later"
description = "Subsonic/Navidrome protocol client for Mixxx"
publish = false

[lib]
name = "subsonic_rs"
crate-type = ["staticlib", "rlib"]

[features]
# The `ffi` feature compiles the cxx bridge module. It is off by default
# so that `cargo test` links without the C++ side of the bridge; the
# Mixxx CMake build enables it via corrosion (FEATURES ffi). The cxx
# dependency itself is unconditional because corrosion_add_cxxbridge
# requires it to appear in the resolved dependency graph.
default = []
ffi = []

[dependencies]
cxx = "1.0"
hex = "0.4"
md-5 = "0.10"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots", "json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
httpmock = "0.7"
